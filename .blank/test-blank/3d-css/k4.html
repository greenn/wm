<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Трансформация div в заднюю стенку куба</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        .scene {
            width: 200px;
            height: 200px;
            perspective: 1000px;
        }
        .cube {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 1s;
        }
        .cube__face {
            position: absolute;
            width: 200px;
            height: 200px;
            border: 2px solid black;
            opacity: 0;
            transition: opacity 1s;
        }
        .cube__face--front { transform: translateZ(100px); background: rgba(255, 0, 0, 0.3); }
        .cube__face--back { transform: translateZ(-100px) rotateY(180deg); background: rgba(0, 0, 255, 0.3); }
        .cube__face--right { transform: rotateY(-90deg) translateZ(100px); background: rgba(0, 255, 0, 0.3); }
        .cube__face--left { transform: rotateY(90deg) translateZ(100px); background: rgba(255, 255, 0, 0.3); }
        .cube__face--top { transform: rotateX(-90deg) translateZ(100px); background: rgba(255, 0, 255, 0.3); }
        .cube__face--bottom { transform: rotateX(90deg) translateZ(100px); background: rgba(0, 255, 255, 0.3); }

        .content {
            width: 180px;
            height: 180px;
            background-color: white;
            position: absolute;
            top: 10px;
            left: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
            text-align: center;
            cursor: pointer;
            transition: transform 1s;
        }

        .cube.show-back {
            transform: translateZ(-100px) rotateY(180deg);
        }
        .cube.show-back .cube__face {
            opacity: 0.7;
        }
        .cube.show-back .content {
            transform: rotateY(180deg);
        }
    </style>
</head>
<body>
<div class="scene">
    <div class="cube" id="cube">
        <div class="cube__face cube__face--front"></div>
        <div class="cube__face cube__face--back"></div>
        <div class="cube__face cube__face--right"></div>
        <div class="cube__face cube__face--left"></div>
        <div class="cube__face cube__face--top"></div>
        <div class="cube__face cube__face--bottom"></div>
        <div class="content" id="content">Нажмите, чтобы увидеть эффект</div>
    </div>
</div>

<script>
    const cube = document.getElementById('cube');
    const content = document.getElementById('content');

    content.addEventListener('click', function() {
        cube.classList.toggle('show-back');
        if (cube.classList.contains('show-back')) {
            content.textContent = 'Теперь это задняя стенка куба';
        } else {
            content.textContent = 'Нажмите, чтобы увидеть эффект';
        }
    });
</script>
</body>
</html>
