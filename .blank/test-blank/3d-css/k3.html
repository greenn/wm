<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Куб с div на задней стенке</title>
    <style>
        .scene {
            width: 200px;
            height: 200px;
            perspective: 1000px;
            margin: 100px auto;
        }
        .cube {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
        }
        .cube__face {
            position: absolute;
            width: 200px;
            height: 200px;
            border: 2px solid black;
            opacity: 0.7;
        }
        .cube__face--front  { transform: translateZ(100px); background: rgba(255, 0, 0, 0.3); }
        .cube__face--back   { transform: translateZ(-100px) rotateY(180deg); background: rgba(0, 0, 255, 0.3); }
        .cube__face--right  { transform: rotateY(-90deg) translateZ(100px); background: rgba(0, 255, 0, 0.3); }
        .cube__face--left   { transform: rotateY(90deg) translateZ(100px); background: rgba(255, 255, 0, 0.3); }
        .cube__face--top    { transform: rotateX(-90deg) translateZ(100px); background: rgba(255, 0, 255, 0.3); }
        .cube__face--bottom { transform: rotateX(90deg) translateZ(100px); background: rgba(0, 255, 255, 0.3); }

        .back-div {
            width: 180px;
            height: 180px;
            background-color: white;
            position: absolute;
            top: 10px;
            left: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
            text-align: center;
            transform: rotateY(180deg);
        }
    </style>
</head>
<body>
<div class="scene">
    <div class="cube">
        <div class="cube__face cube__face--front"></div>
        <div class="cube__face cube__face--back">
            <div class="back-div">Этот текст находится на задней внутренней стенке куба</div>
        </div>
        <div class="cube__face cube__face--right"></div>
        <div class="cube__face cube__face--left"></div>
        <div class="cube__face cube__face--top"></div>
        <div class="cube__face cube__face--bottom"></div>
    </div>
</div>
</body>
</html>
