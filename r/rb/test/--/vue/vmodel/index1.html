<script>
    var _log = Log.for('DBG');
    VueRoot.root.init({
        mount: '#app',
        decl: function(_log){
            return {
                data() {
                    return {
                        title: 'cmpt-title',
                    };
                },
                methods: {
                    updateData() {
                        this.title = 'cmpt-title 2';
                    }
                }
            }
        },

    });
</script>

<div id="app">
	<pre>title: {{ title }}</pre>

	<ui-custom v-model:value="title"></ui-custom>
	<ui-field v-model:value="title"></ui-field>

	<button @click="updateData">Обновить данные</button>
</div>

<script type="text/x-template" id="ui-field">
	<div fxr>
		ui-field:
		<input
			:value="value"
			@input="$emit('update:value', $event.target.value)"
		/>
	</div>
</script><script type="text/javascript">
    _vue('ui-field', function(_log, _cmd){
        return {
            props: ['value'],
            emits: ['update:value'],
        }
    })
</script>

<script type="text/x-template" id="ui-custom">
	<div fxr>
		ui-custom:
		<ui-field

			@input="$emit('update:value', $event.target.value)"
		></ui-field>

</script><script type="text/javascript">
