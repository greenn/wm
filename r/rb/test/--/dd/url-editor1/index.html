<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Создание URL</title>
</head>
<body>

<!-- Базовый URL -->
Base URL: <input type="text" id="baseURL" value="http://kod.nadube/api/post/metro/targets/create?"><br>

<!-- Поля для UID и Title -->
fields[uid]: <input type="text" id="uid"><br>
fields[title]: <input type="text" id="title"><br>

<!-- Поля для targets -->
<div id="targetsContainer">
    <!-- Пример блока для target -->
    <div class="targetBlock">
        <button onclick="removeTarget(this)">Удалить target</button><br>
        fields[targets][0][id]: <input type="text" class="targetId"><br>
        fields[targets][0][name]: <input type="text" class="targetName"><br>
        <!-- ... добавьте остальные поля target здесь ... -->
    </div>
</div>
<button onclick="addTarget()">Добавить target</button><br>

<!-- Кнопка для генерации URL -->
<button onclick="generateURL()">Сгенерировать URL</button>
<br>
<!-- Место для отображения сгенерированного URL -->
<textarea id="generatedURL" rows="5" cols="100"></textarea>

<script>
    let targetCount = 1;

    function generateURL() {
        let baseURL = document.getElementById('baseURL').value;
        let uid = document.getElementById('uid').value;
        let title = document.getElementById('title').value;
        
        let url = baseURL + "fields[uid]=" + uid + "&fields[title]=" + title;

        // Добавляем target поля
        let targets = document.getElementsByClassName('targetBlock');
        for (let i = 0; i < targets.length; i++) {
            let id = targets[i].getElementsByClassName('targetId')[0].value;
            let name = targets[i].getElementsByClassName('targetName')[0].value;
            // ... добавьте сюда код для остальных полей target ...
            url += `&fields[targets][${i}][id]=${id}&fields[targets][${i}][name]=${name}`;
        }

        // Отображаем URL
        document.getElementById('generatedURL').value = url;
    }

    function addTarget() {
        let newTarget = document.createElement('div');
        newTarget.className = 'targetBlock';
        newTarget.innerHTML = `
            <button onclick="removeTarget(this)">Удалить target</button><br>
            fields[targets][${targetCount}][id]: <input type="text" class="targetId"><br>
            fields[targets][${targetCount}][name]: <input type="text" class="targetName"><br>
            <!-- ... добавьте остальные поля target здесь ... -->
        `;
        document.getElementById('targetsContainer').appendChild(newTarget);
        targetCount++;
    }

    function removeTarget(button) {
        let targetBlock = button.parentElement;
        document.getElementById('targetsContainer').removeChild(targetBlock);
    }
</script>

</body>
</html>
